# Builds mpr for the platforms admins use, and attaches the archives to the
# GitHub release for a v* tag. The server ships as an image instead; see
# .github/workflows/ci.yml.
version: 2

project_name: mpr

builds:
  - id: mpr
    main: ./cmd/mpr
    binary: mpr
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    # Go stamps the tag into the build itself, which mpr --version reads, so
    # there is no -X for the version here.
    ldflags: [-s -w]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  use: github-native
